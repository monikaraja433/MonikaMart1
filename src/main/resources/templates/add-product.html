<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - MonikaMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        /* Navbar */
        .navbar {
            background: #2874f0;
            color: white;
            padding: 16px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        /* Main */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #212121;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2874f0;
            box-shadow: 0 0 0 2px rgba(40, 116, 240, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2874f0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1257c7;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2874f0;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">

        <div class="logo">
            🛍️ MonikaMart
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="/cart">🛒 Cart</a>
        </div>

    </div>


    <!-- Add Product -->
    <div class="container">

        <div class="card">

            <h1>Add Product</h1>

            <p class="subtitle">
                Add a new product to your MonikaMart store
            </p>

            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post">

                <div class="form-group">

                    <label>Product Name</label>

                    <input type="text"
                           th:field="*{name}"
                           placeholder="Enter product name"
                           required>

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea th:field="*{description}"
                              placeholder="Enter product description"
                              required></textarea>

                </div>


                <div class="form-group">

                    <label>Price (₹)</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           placeholder="Enter price"
                           required>

                </div>


                <div class="form-group">

                    <label>Stock</label>

                    <input type="number"
                           th:field="*{stock}"
                           placeholder="Enter available stock"
                           required>

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <input type="text"
                           th:field="*{category}"
                           placeholder="Example: Electronics, Fashion"
                           required>

                </div>


                <div class="form-group">

                    <label>Image URL</label>

                    <input type="text"
                           th:field="*{image}"
                           placeholder="Enter image URL">

                </div>


                <button type="submit" class="submit-btn">
                    ➕ Add Product
                </button>

            </form>


            <a href="/products" class="back-btn">
                ← View All Products
            </a>

        </div>

    </div>

</body>
</html>
