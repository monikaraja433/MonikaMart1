<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>MonikaMart - Register</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .register-container {
        width: 420px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
        text-align: center;
        margin-bottom: 10px;
    }

    .logo h1 {
        color: #2874f0;
        font-size: 32px;
    }

    .logo p {
        color: #777;
        margin-top: 5px;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
    }

    .input-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .input-group input:focus {
        border-color: #2874f0;
        box-shadow: 0 0 5px rgba(40, 116, 240, 0.3);
    }

    .register-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #2874f0, #6a5acd);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
        transition: 0.3s;
    }

    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(40, 116, 240, 0.3);
    }

    .login-link {
        text-align: center;
        margin-top: 22px;
        color: #666;
    }

    .login-link a {
        color: #2874f0;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

</style>
```

</head>

<body>

```
<div class="register-container">

    <div class="logo">
        <h1>🛍️ MonikaMart</h1>
        <p>Create your account</p>
    </div>

    <form action="/register" method="post">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text"
                   name="fullName"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="input-group">
            <label>Phone</label>
            <input type="tel"
                   name="phone"
                   placeholder="Enter your phone number"
                   required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>
        </div>

        <button type="submit" class="register-btn">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>
```

</body>

</html>
