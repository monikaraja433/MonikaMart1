<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>MonikaMart - Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .cart-container {
            max-width: 900px;
            margin: auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .quantity a {
            padding: 8px 14px;
            margin: 5px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .remove {
            background: #e53935 !important;
        }

        .total {
            background: white;
            padding: 20px;
            text-align: right;
            font-size: 22px;
            font-weight: bold;
        }

        .order-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #fb641b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>🛒 My Cart</h1>

<div class="cart-container">

    <div th:each="item : ${cartItems}" class="cart-item">

        <h2 th:text="${item.productName}"></h2>

        <p>
            Price:
            ₹<span th:text="${item.price}"></span>
        </p>

        <div class="quantity">

            Quantity:

            <a th:href="@{/cart/decrease/{id}(id=${item.id})}">
                −
            </a>

            <span th:text="${item.quantity}"></span>

            <a th:href="@{/cart/increase/{id}(id=${item.id})}">
                +
            </a>

        </div>

        <p>
            Product Total:
            ₹<span th:text="${item.total}"></span>
        </p>

        <a class="quantity remove"
           th:href="@{/cart/remove/{id}(id=${item.id})}">
            Remove
        </a>

    </div>

    <div class="total">

        Grand Total:
        ₹<span th:text="${total}"></span>

        <br>

        <a class="order-btn" href="/order/place">
            📦 Place Order
        </a>

    </div>

</div>

</body>
</html>
