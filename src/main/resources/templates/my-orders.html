<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - MonikaMart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #2874f0;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 30px 50px;
        }

        .order-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-card h2 {
            margin-top: 0;
            color: #2874f0;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
            color: #388e3c;
        }

        .status {
            font-weight: bold;
            margin-top: 15px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>

    <h1>🛍️ MonikaMart</h1>

    <a href="/" class="back-btn">
        ← Home
    </a>

</header>

<div class="container">

    <h1>📦 My Orders</h1>

    <div th:if="${orders != null and !orders.isEmpty()}">

        <div class="order-card"
             th:each="order : ${orders}">

            <h2>
                Order #<span th:text="${order.id}">1</span>
            </h2>

            <p>
                <strong>Order Date:</strong>
                <span th:text="${order.orderDate}">
                    Date
                </span>
            </p>

            <p class="amount">
                Total Amount:
                ₹<span th:text="${order.totalAmount}">
                    0
                </span>
            </p>

            <p class="status">
                Status:
                <span th:text="${order.status}">
                    PLACED
                </span>
            </p>

        </div>

    </div>

    <div class="empty"
         th:if="${orders == null or orders.isEmpty()}">

        <h2>📭 No Orders Yet</h2>

        <p>You haven't placed any orders yet.</p>

        <a href="/products" class="btn">
            Shop Now
        </a>

    </div>

</div>

</body>

</html>
